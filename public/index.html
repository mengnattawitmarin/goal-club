<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0b09">
<meta name="description" content="ความน่าจะเป็นคู่ฟุตบอลวันนี้ จากตารางคะแนน ฟอร์ม และผลที่เคยเจอกัน เทียบราคาตลาด">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goal Club">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Goal Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 680px). Sticky header = brand row + date strip + status.
   Five tabs, each with one job: หน้าหลัก (today at a glance), โปรแกรม (full list), วิเคราะห์ (picks & prices),
   ทีมโปรด, เพิ่มเติม (settings & guides). Match detail is a full-screen sheet with three tabs. */
:root{
  --bg:#0c0b09; --surface:#15130f; --surface-2:#201c16; --surface-3:#2a251d; --line:#342d23; --line-soft:#26211a;
  --fg:#f7f1e6; --muted:#b5aa9a; --faint:#7f7567;
  --gold:#f0cc86; --gold-deep:#c9a35b; --gold-ink:#1c1408;
  --win:#8fc79a; --draw:#d9c48a; --loss:#e08b7a;
  --font-display:"Taviraj","Sarabun",Georgia,serif;
  --font-body:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold)} .green{color:var(--win)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.brandrow{display:flex;align-items:center;gap:var(--s2);padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:600;font-size:21px;color:var(--gold);line-height:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 26%,transparent);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.searchrow{padding-bottom:8px}
.searchrow input{width:100%;height:42px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px}
.datestrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 8px;scroll-snap-type:x proximity}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:64px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;line-height:1.2;scroll-snap-align:start}
.dchip .d1{font-size:12.5px;font-weight:600;color:var(--fg)}
.dchip .d2{font-size:11px;color:var(--faint)}
.dchip.on{background:var(--gold);border-color:var(--gold)}
.dchip.on .d1,.dchip.on .d2{color:var(--gold-ink)}
.dchip.has-live{border-color:color-mix(in srgb,var(--win) 60%,transparent)}
.status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);padding-bottom:8px;min-height:22px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-deep);display:inline-block;flex:none}
.dot.live{background:var(--win)} .dot.bad{background:var(--loss)}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

main{padding-top:var(--s3);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* ---------- section heads ---------- */
.sec{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s3)}
.sec:first-child{margin-top:var(--s2)}
.sec h2{font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--gold);margin:0;text-wrap:balance}
.sec .sub{font-size:12px;color:var(--faint)}
.sec .act{margin-left:auto;font-size:13px;color:var(--gold);font-weight:500;white-space:nowrap}
.pagetitle{font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--gold);margin:var(--s2) 0 var(--s1)}
.pagelead{margin:0 0 var(--s4);color:var(--muted);font-size:13.5px}

/* ---------- controls ---------- */
.seg{display:flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;height:34px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface-3);color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent)}
.seg button .n{font-size:11px;opacity:.7;margin-left:4px}
.toolbar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s3);flex-wrap:wrap}
.toolbar .seg{flex:1 1 260px}
.select{appearance:none;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 34px 0 12px;font-size:13.5px;color:var(--fg);max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.select.on{border-color:var(--gold);color:var(--gold)}
.btn{height:42px;padding:0 16px;border-radius:var(--r-md);background:var(--gold);color:var(--gold-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.btn.small{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.value{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.tag.live{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.tag.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.tag.warn{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}

/* ---------- surfaces ---------- */
.card{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:var(--s4)}
.card.gold{background:linear-gradient(180deg,#211b13 0%,#14110d 100%);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.card.flat{padding:0;overflow:hidden}
.note{font-size:12.5px;color:var(--faint);margin:var(--s2) 0 0}
.empty{text-align:center;padding:var(--s6) var(--s4)}
.empty h3{font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--gold);margin:0 0 6px}
.empty p{margin:0 0 var(--s4);color:var(--muted)}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tile{border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.tile .k{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--fg)}
.tile.live .v{color:var(--win)} .tile.value .v{color:var(--gold)}

/* team badge + logo */
.badge{position:relative;width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#1a140c;overflow:hidden}
.badge.sm{width:22px;height:22px;font-size:9px}
.badge.lg{width:60px;height:60px;font-size:17px}
.badge .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:var(--surface-2);border-radius:50%}
.badge.lg .logo{padding:6px}
.pills{display:flex;gap:3px;flex:none}
.pill{width:16px;height:16px;border-radius:4px;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#14100a}
.pill.W{background:var(--win)} .pill.D{background:var(--draw)} .pill.L{background:var(--loss)}

/* big match card (home) */
.mcard{display:block;width:100%;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:14px}
.mcard:hover{border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.mhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mhead .lg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--faint);flex:none}
.star.on{color:var(--gold)} .star.on svg{fill:var(--gold)}
.teams{display:grid;grid-template-columns:1fr auto;gap:8px 10px;margin-top:8px;align-items:center}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team .rk{font-size:11px;color:var(--faint);flex:none}
.score{font-family:var(--font-display);font-size:22px;text-align:right;min-width:24px;line-height:1}
.probbar{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:12px;background:var(--surface-2);gap:2px}
.probbar i{display:block;height:100%}
.probbar .h{background:var(--gold)} .probbar .d{background:#6e6250} .probbar .a{background:#e8e0d2}
.problabels{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;color:var(--muted)}
.problabels b{color:var(--fg);font-weight:600}
.mfoot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.mfoot b{color:var(--gold);font-weight:600}

/* compact match row (lists) */
.list{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.lhead{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;letter-spacing:.04em;color:var(--gold-deep);background:var(--surface-2);font-weight:600}
.lhead .n{margin-left:auto;color:var(--faint);font-weight:500}
.mrow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);width:100%}
.lhead + .mrow,.mrow:first-child{border-top:0}
.mrow:hover{background:var(--surface-2)}
.mrow .t{font-size:12.5px;color:var(--muted);text-align:left;grid-row:span 2}
.mrow .tm{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mrow .r{text-align:right;font-size:13px;min-width:36px}
.mrow .r b{font-size:15px}
.mrow .meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--faint);margin-top:2px}
.mrow .meta b{color:var(--gold);font-weight:600}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-soft);width:100%}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow .main{min-width:0}
.lrow .main div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:12px;color:var(--faint)}
.lrow .r{text-align:right;font-size:13px}

/* live state (green) */
.is-live.mcard{border-color:color-mix(in srgb,var(--win) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--win) 13%,var(--surface)) 0%,var(--surface) 75%)}
.is-live.mcard .score{color:var(--win);font-weight:600}
.is-live.mcard .probbar .h{background:var(--win)}
.is-live.mrow,.is-live.lrow{background:color-mix(in srgb,var(--win) 10%,var(--surface));box-shadow:inset 3px 0 0 var(--win)}
.is-live.mrow .t,.is-live.mrow .r b{color:var(--win);font-weight:600}
.goal{box-shadow:0 0 0 2px var(--win)!important;animation:goalflash 1.2s ease-out 2}
@keyframes goalflash{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--win) 35%,transparent)!important}}

/* skeleton */
.skel{display:flex;flex-direction:column;gap:10px}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),#2c261d,var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk.w40{width:40%}.sk.w70{width:70%}.sk.w60{width:60%}.sk.bar{height:6px;width:100%}
@keyframes shimmer{to{background-position:-200% 0}}

/* brief */
.brief h3{font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--gold);margin:0}
.brief p{margin:8px 0 0}
.brief ul{margin:8px 0 0;padding-left:18px}
.brief li{margin:4px 0}
.brief details summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:10px}

/* picks */
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-soft);width:100%}
.pick:first-child{border-top:0}
.pick:hover{background:var(--surface-2)}
.pick .rank{font-family:var(--font-display);font-size:22px;color:var(--gold-deep);width:22px;text-align:center;grid-row:span 2}
.pick .ph{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .sub{grid-column:2 / 4;font-size:12px;color:var(--faint)}
.meter{width:64px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--gold)}

/* settings / guides */
.group{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.gitem{padding:14px;border-top:1px solid var(--line-soft)}
.gitem:first-child{border-top:0}
.gitem .lbl{font-weight:600;margin-bottom:6px}
.gitem .desc{font-size:13px;color:var(--muted)}
details.acc{border-top:1px solid var(--line-soft)}
details.acc:first-child{border-top:0}
details.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:600;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .15s}
details.acc[open] summary::after{transform:rotate(-135deg)}
details.acc .body{padding:0 14px 14px;font-size:14px;color:var(--fg)}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin:0 0 10px}
ol.steps b{color:var(--gold)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
.sheet .bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet .bar .lg{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.face{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;text-align:center;margin-top:var(--s4)}
.face .badge{margin:0 auto 8px}
.face .nm{font-weight:600;line-height:1.25;text-wrap:balance}
.face .meta{font-size:12px;color:var(--faint);margin-top:2px}
.face .mid{font-family:var(--font-display);font-size:32px;color:var(--gold);line-height:1;padding-top:14px;min-width:92px}
.face .mid small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:6px}
.face .mid.live{color:var(--win)}
.sheet .seg{margin-top:var(--s4);position:sticky;top:59px;z-index:1;background:var(--surface)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.kv .k{font-size:11.5px;color:var(--faint)}
.kv .v{font-size:17px;font-weight:600;color:var(--fg)}
.kv .v.gold{color:var(--gold)}
.kv .v small{font-size:12px;color:var(--faint);font-weight:400}
.grid6{display:grid;grid-template-columns:24px repeat(6,minmax(0,1fr));gap:3px;font-size:11.5px}
.grid6 span{display:grid;place-items:center;height:30px;border-radius:5px}
.grid6 .hd{color:var(--faint)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--faint);text-align:right;padding:6px 4px;font-size:11.5px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-top:1px solid var(--line-soft);text-align:right}
.scroll-x{overflow-x:auto}
.statgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;font-size:13px}
.statgrid > *{padding:8px 0;border-top:1px solid var(--line-soft)}
.statgrid > .h{border-top:0;color:var(--faint);font-size:11.5px}
.statgrid > :nth-child(3n+2),.statgrid > :nth-child(3n){text-align:right;padding-left:16px}
.form-lines{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.form-lines span{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--surface-2)}
.omen{border:1px dashed color-mix(in srgb,var(--gold) 38%,transparent);border-radius:var(--r-lg);padding:14px}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--faint);min-width:0}
label.f input,label.f select{height:42px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:15px;width:100%;color:var(--fg)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.out{margin-top:10px;font-size:13.5px;line-height:1.6}


/* drawers (home) */
.drawer{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.drawer.gold{background:linear-gradient(180deg,#211b13 0%,#14110d 100%);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}

/* "วันนี้" = the feed's match day. ESPN days follow US Eastern time, so a Thai match day runs from late morning

const bkkToday = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const shiftDate = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); };
const weekday = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
const dayLabel = iso => { const [y,m,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("th-TH",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d))); };
const kickTime = iso => new Intl.DateTimeFormat("th-TH",{timeZone:"Asia/Bangkok",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const stampTime = iso => new Intl.DateTimeFormat("th-TH",{timeZone:"Asia/Bangkok",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const bkkDateOf = iso => new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
const nextSaturday = from => { const add = (6 - weekday(from) + 7) % 7 || 7; return shiftDate(from, add); };
function relLabel(iso){ const t=bkkToday(); if(iso===t) return "วันนี้"; if(iso===shiftDate(t,1)) return "พรุ่งนี้"; if(iso===shiftDate(t,-1)) return "เมื่อวาน"; return dayLabel(iso); }

/* ---------- model: Poisson + Dixon-Coles (rho -0.08) ---------- */
const RHO = -0.08, MAXG = 10;
const clamp = (n,a,b) => Math.min(b, Math.max(a, n));
function formPPG(form){
  const c = (form||"").toUpperCase().replace(/[^WDL]/g,""); if(!c) return null;
  let w=0,s=0; for(let i=0;i<c.length;i++){ const wt=(i+1)/c.length; w += (c[i]==="W"?3:c[i]==="D"?1:0)*wt; s+=wt; } return w/s;
}
function formNudge(form){ const p=formPPG(form); if(p==null) return 1; return clamp(1+((p-1.4)/1.4)*0.12, 0.82, 1.18); }
function formGoals(form){ const p=formPPG(form); if(p==null) return {score:1.28,concede:1.28}; return {score:0.75+(p/3)*1.3, concede:1.85-(p/3)*0.9}; }
const PRIOR = 8;
const shrunk = (count,played,avg) => (count + avg*PRIOR)/(played + PRIOR);
const hasTable = s => s.played!=null && s.played>=3 && s.gf!=null && s.ga!=null;
function baseLambdas(h, a, avg){
  const ht=hasTable(h), at=hasTable(a); avg = avg && avg>0.4 ? avg : null;
  const att = s => clamp(shrunk(s.gf,s.played,avg)/avg,0.4,2.2)*formNudge(s.form);
  const def = s => clamp(shrunk(s.ga,s.played,avg)/avg,0.4,2.2)/formNudge(s.form);
  if(avg && ht && at) return {lh:clamp(att(h)*def(a)*avg*1.18,0.15,4.2), la:clamp(att(a)*def(h)*avg*0.9,0.15,4.2), basis:"table"};
  if(avg && (ht||at)){
    const fo = s => { const f=formGoals(s.form); return {att:clamp(f.score/avg,0.35,2.6), def:clamp(f.concede/avg,0.35,2.6)}; };
    const H = ht ? {att:att(h),def:def(h)} : fo(h), A = at ? {att:att(a),def:def(a)} : fo(a);
    return {lh:clamp(H.att*A.def*avg*1.18,0.15,4.2), la:clamp(A.att*H.def*avg*0.9,0.15,4.2), basis:"blend"};
  }
  const hf=formGoals(h.form), af=formGoals(a.form);
  return {lh:clamp(hf.score*(af.concede/1.28)*1.1,0.15,4.2), la:clamp(af.score*(hf.concede/1.28)*0.92,0.15,4.2), basis:"form"};
}
function pmf(k,l){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function grid(lh,la){
  const g=[]; let s=0;
  for(let h=0;h<=MAXG;h++){ g[h]=[]; for(let a=0;a<=MAXG;a++){
    let p=pmf(h,lh)*pmf(a,la);
    if(h===0&&a===0) p*=1-lh*la*RHO; else if(h===0&&a===1) p*=1+lh*RHO; else if(h===1&&a===0) p*=1+la*RHO; else if(h===1&&a===1) p*=1-RHO;
    g[h][a]=Math.max(0,p); s+=g[h][a]; } }
  for(const r of g) for(let a=0;a<r.length;a++) r[a]/=s;
  return g;

/* ---------- market-implied expected goals: fit (λh, λa) to de-vigged 1X2 (+ total line) ---------- */
function marketLambdas(m, modelTotal){
  const mk=m.mk; if(!mk?.home||!mk?.draw||!mk?.away) return null;
  const f=devig([mk.home.decimal,mk.draw.decimal,mk.away.decimal]); if(!f) return null;
  let tOver=null, tLine=null;
  if(mk.total){ const t=devig([mk.total.over.decimal,mk.total.under.decimal]); if(t){ tOver=t[0]; tLine=mk.total.line; } }
  const pm=l=>{ const v=[]; let p=Math.exp(-l); for(let k=0;k<=9;k++){ v.push(p); p*=l/(k+1); } return v; };
  const cache=new Map(); const P=l=>{ const k=l.toFixed(3); if(!cache.has(k)) cache.set(k,pm(l)); return cache.get(k); };
  const err=(h,a)=>{
    if(tOver==null && Math.abs(h+a-modelTotal)>.1) return 9;
    const x=P(h), y=P(a); let ph=0,pd=0,pa=0; const tot=Array(19).fill(0);
    for(let i=0;i<10;i++) for(let j=0;j<10;j++){ const p=x[i]*y[j]; if(i>j) ph+=p; else if(i===j) pd+=p; else pa+=p; tot[i+j]+=p; }
    let e=(ph-f[0])**2+(pd-f[1])**2+(pa-f[2])**2;
    if(tOver!=null){ let w=0,l=0; for(const part of atomic(tLine)) tot.forEach((p,t)=>{ if(t>part.line+1e-9) w+=p*part.w; else if(t<part.line-1e-9) l+=p*part.w; }); e+=(((w+l)>0?w/(w+l):.5)-tOver)**2; }
    return e;
  };
  let best={e:9,lh:1,la:1};
  for(let h=.2;h<=3.6;h+=.1) for(let a=.2;a<=3.6;a+=.1){ const e=err(h,a); if(e<best.e) best={e,lh:h,la:a}; }
  const c=best; for(let h=c.lh-.1;h<=c.lh+.1;h+=.02) for(let a=c.la-.1;a<=c.la+.1;a+=.02){ if(h<.1||a<.1) continue; const e=err(h,a); if(e<best.e) best={e,lh:h,la:a}; }
  return best.e<.01 ? {lh:best.lh, la:best.la, fromTotal:tOver!=null} : null;
}

/* ---------- in-play: remaining expected goals on top of the current score ---------- */
function matchMinute(m){
  if(m.st!=="in") return null;
  const c=String(m.clock||"");
  if(/พัก|HT/i.test(c)) return 45;
  const n=c.match(/(\d+)(?:'|\+|$)/); const add=c.match(/\+(\d+)/);
  return n ? Math.min(120, Number(n[1])+(add?Number(add[1]):0)) : null;
}
function liveModel(m){
  const min=matchMinute(m); if(min==null||m.h.score==null) return null;
  const left=Math.max(0,(94-min)/94);
  const g=grid(Math.max(.01,m.lh*left),Math.max(.01,m.la*left));
  let ph=0,pd=0,pa=0,best={p:0}; g.forEach((r,i)=>r.forEach((p,j)=>{ const H=m.h.score+i, A=m.a.score+j; if(H>A) ph+=p; else if(H===A) pd+=p; else pa+=p; if(p>best.p) best={p,h:H,a:A}; }));
  const pMore=1-g[0][0];
  return {min, ph, pd, pa, final:best, pMore};
}

/* ---------- extra markets from the same expected goals ---------- */
function extraMarkets(m){
  const H1=.45, lh=m.lh, la=m.la;
  const pois=(k,l)=>{ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; };
  const res=(lH,lA)=>{ let h=0,d=0,a=0; for(let i=0;i<=8;i++) for(let j=0;j<=8;j++){ const p=pois(i,lH)*pois(j,lA); if(i>j) h+=p; else if(i===j) d+=p; else a+=p; } return {h,d,a}; };
  // half-time / full-time: first-half goals then second-half goals, independent Poisson
  const ht=[], htft={};
  for(let i=0;i<=6;i++) for(let j=0;j<=6;j++) ht.push({i,j,p:pois(i,lh*H1)*pois(j,la*H1)});
  for(const x of ht){
    const hs=x.i>x.j?"h":x.i===x.j?"d":"a";
    for(let k=0;k<=6;k++) for(let l=0;l<=6;l++){ const p=x.p*pois(k,lh*(1-H1))*pois(l,la*(1-H1)); const H=x.i+k, A=x.j+l; const fs=H>A?"h":H===A?"d":"a"; htft[hs+fs]=(htft[hs+fs]||0)+p; }
  }
  const htftTop=Object.entries(htft).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const p00=m.g[0][0];
  const first={h:(1-p00)*lh/(lh+la), a:(1-p00)*la/(lh+la), none:p00};
  let cleanH=0, cleanA=0, nilH=0, nilA=0, odd=0; const margin={};
  m.g.forEach((r,i)=>r.forEach((p,j)=>{ if(j===0) cleanH+=p; if(i===0) cleanA+=p; if(i>j&&j===0) nilH+=p; if(j>i&&i===0) nilA+=p; if((i+j)%2) odd+=p; const d=i-j; const k=d>=3?"h3":d===2?"h2":d===1?"h1":d===0?"d":d===-1?"a1":d===-2?"a2":"a3"; margin[k]=(margin[k]||0)+p; }));
  return {
    h1:res(lh*H1,la*H1), goal1H:1-Math.exp(-(lh+la)*H1), goal2H:1-Math.exp(-(lh+la)*(1-H1)),
    first, cleanH, cleanA, nilH, nilA, odd, even:1-odd, margin, htftTop,
    over15:m.g.reduce((s,r,i)=>s+r.reduce((t,p,j)=>t+(i+j>=2?p:0),0),0),
    over35:m.g.reduce((s,r,i)=>s+r.reduce((t,p,j)=>t+(i+j>=4?p:0),0),0)
  };
}

/* ---------- scorers and assisters: each player's share of his team's season goals ---------- */
function scorerModel(m){
  const ps=m.ds?.players||[]; if(!ps.length) return null;
  const sideOf=p=>p.side||(String(p.team||"").toLowerCase()===m.h.name.toLowerCase()?"h":String(p.team||"").toLowerCase()===m.a.name.toLowerCase()?"a":null);
  const starters=new Set(m.ds?.lineup?.starters||[]); const known=!!m.ds?.lineup?.known;
  const teamGoals=s=>{ const t=s==="h"?m.h:m.a; const fromTable=t.gf; const fromList=ps.filter(p=>sideOf(p)===s).reduce((a,p)=>a+(p.goals||0),0); return Math.max(fromTable||0, fromList*1.6, 1); };
  const out=[];
  for(const p of ps){
    const s=sideOf(p); if(!s) continue;
    const lam=s==="h"?m.lh:m.la, tg=teamGoals(s);
    const play = known ? (p.id&&starters.has(String(p.id))?1:.25) : .85;
    const gShare=clamp((p.goals||0)/tg,0,.6), aShare=clamp((p.assists||0)/tg,0,.5);
    const xg=lam*gShare*play, xa=lam*aShare*play;

      return {w,d,l,lines,ha,dates:dates.filter(Boolean).sort().reverse()}; };
    /* season leaders per team: goals, assists */
    const leaders={};
    for(const side of p.leaders||[]){
      const tid=String(side.team?.id??""); if(!tid) continue;
      for(const cat of side.leaders||[]){
        const key=/goal/i.test(cat.name||"")?"goals":/assist/i.test(cat.name||"")?"assists":null; if(!key) continue;
        for(const ld of (cat.leaders||[]).slice(0,3)){
          const a=ld.athlete; if(!a?.id) continue;
          const v=Number(String(ld.displayValue||ld.value||"").replace(/[^\d.]/g,""));
          const rec=(leaders[tid]=leaders[tid]||{})[a.id]=leaders[tid]?.[a.id]||{id:String(a.id),name:a.displayName||a.shortName,team:tid,goals:null,assists:null};
          rec[key]=Number.isFinite(v)?v:null;
        }
      }
    }
    /* line-ups, when ESPN has them */
    const starters={}; let known=false;
    for(const r of p.rosters||[]){ const tid=String(r.team?.id??""); const st=(r.roster||[]).filter(x=>x.starter); if(st.length>=10){ known=true; starters[tid]=new Set(st.map(x=>String(x.athlete?.id))); } }
    const miss=tid=>known&&starters[tid] ? Object.values(leaders[tid]||{}).filter(x=>(x.goals||0)>=3&&!starters[tid].has(x.id)).map(x=>x.name) : [];
    const v=p.gameInfo?.venue;
    const players=[...Object.values(leaders[m.h.id]||{}),...Object.values(leaders[m.a.id]||{})].map(x=>({...x,team:x.team===m.h.id?m.h.name:m.a.name,side:x.team===m.h.id?"h":"a"}));
    return {h2h:ser?.summary||null,meet,hf:five(m.h.id),af:five(m.a.id),venue:v?.fullName||null,city:v?.address?.city||null,country:v?.address?.country||null,
      players, marks:[], lineup: known?{known:true,hMiss:miss(m.h.id),aMiss:miss(m.a.id),starters:[...(starters[m.h.id]||[]),...(starters[m.a.id]||[])]}:null};
  }catch{ return null; }
}

async function loadWeather(m){
  const city=m.ds?.city; if(!city) return null;
  const ko=new Date(m.ko), days=(ko-Date.now())/864e5; if(days<-0.2||days>14) return null;
  try{
    const geo=await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en`,6000);
    const g=geo.results?.[0]; if(!g) return null;
    const day=ko.toISOString().slice(0,10);
    const f=await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&hourly=temperature_2m,precipitation,wind_speed_10m&start_date=${day}&end_date=${day}&timezone=UTC`,6000);
    const i=Math.min(23,ko.getUTCHours());
    return {temp:f.hourly.temperature_2m[i], rain:f.hourly.precipitation[i], wind:f.hourly.wind_speed_10m[i], elev:g.elevation??0, place:g.name};
  }catch{ return null; }
}
async function athleteDob(id){
  if(extCache["a"+id]!==undefined) return extCache["a"+id];
  try{ const j=await espnCore(`v2/sports/soccer/athletes/${id}`); extCache["a"+id]=(j.dateOfBirth||"").slice(0,10)||null; }catch{ return null; }
  saveExt(); return extCache["a"+id];
}
async function wikiJson(params){ return getJson(`https://en.wikipedia.org/w/api.php?${new URLSearchParams({...params,format:"json",origin:"*"})}`,7000); }
async function wikiText(title){ const j=await wikiJson({action:"query",prop:"revisions",rvprop:"content",rvslots:"main",rvsection:"0",titles:title,redirects:"1"}); const pg=Object.values(j.query?.pages||{})[0]; return pg?.revisions?.[0]?.slots?.main?.["*"]||""; }
function wikiDob(text){ const m=text.match(/birth[ _]date(?:[ _]and[ _]age)?\s*\|\s*(?:df=y\w*\|\s*|mf=y\w*\|\s*)?(\d{4})\s*\|\s*(\d{1,2})\s*\|\s*(\d{1,2})/i); return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:null; }
async function teamCoach(team){
  const key="c"+team.id; if(extCache[key]!==undefined) return extCache[key];
  let out=null;
  try{
    const s=await wikiJson({action:"query",list:"search",srsearch:`${team.name} football club`,srlimit:"1"});
    const title=s.query?.search?.[0]?.title;
    if(title){
      const txt=await wikiText(title);
      const mm=txt.match(/\|\s*(?:manager|head[ _]coach|coach)\s*=\s*([^\n]+)/i);
      if(mm){
        const link=mm[1].match(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/);
        const name=link?(link[2]||link[1]):mm[1].replace(/<[^>]+>|\{\{[^}]*\}\}|'''?/g,"").trim();
        let dob=null; if(link){ try{ dob=wikiDob(await wikiText(link[1])); }catch{} }
        if(name && name.length<40) out={name:name.trim(),dob};
      }
    }
  }catch{ return null; }
  extCache[key]=out; saveExt(); return out;
}
async function loadPeople(m){
  const ps=(m.ds?.players||[]).filter(p=>p.id).slice(0,6);
  const [dobs,hc,ac]=await Promise.all([Promise.all(ps.map(p=>athleteDob(p.id))),teamCoach(m.h),teamCoach(m.a)]);

}

function snapshotDay(date){
  const d=SNAPSHOT?.[date]; if(!d) return null;
  const old = Date.now()-Date.parse(d.fetchedAt) > 3*3600e3;
  return {fetchedAt:d.fetchedAt, matches: old ? d.matches.map(m=>m.st==="in"?{...m,st:"unk"}:m) : d.matches, source:"snapshot"};
}
function prepare(day){
  const seen=new Set();
  const matches=day.matches.filter(m=>!seen.has(m.id)&&seen.add(m.id)).map(refine)
    .sort((a,b)=>a.ko.localeCompare(b.ko)||(LEAGUE_ORDER[a.lg]??99)-(LEAGUE_ORDER[b.lg]??99));
  return {...day, matches};
}
function getDay(date){
  if(!S.days[date]){
    const snap=snapshotDay(date), cached=store.get("day:"+date,null);
    const useCache = cached?.matches?.length && (!snap || cached.fetchedAt > snap.fetchedAt);
    S.days[date] = useCache ? prepare({...cached, source:"cache"}) : snap ? prepare(snap) : {fetchedAt:null, matches:[], source:"none"};
  }
  return S.days[date];
}
function saveDay(date){
  const d=S.days[date]; if(!d?.matches?.length) return;
  store.set("day:"+date,{fetchedAt:d.fetchedAt, matches:d.matches.map(m=>m.raw||m)});
  try{ const keep=new Set([shiftDate(bkkToday(),-1),bkkToday(),shiftDate(bkkToday(),1),shiftDate(bkkToday(),2),date]);
    Object.keys(localStorage).filter(k=>k.startsWith("gc:day:")&&!keep.has(k.slice(7))).forEach(k=>localStorage.removeItem(k)); }catch{}
}
async function probeLive(){
  if(S.liveOk!=null) return S.liveOk;
  try{ await espn(`site/v2/sports/soccer/eng.1/scoreboard`,5000); S.liveOk=true; }catch{ S.liveOk=false; }
  return S.liveOk;
}
async function refresh(date, manual, light){
  if(S.loading){ S.queued={date,manual}; return; }
  S.loading=date; S.err=null;
  const btn=$("#btnRefresh");
  btn.classList.add("spin"); paintStatus();
  try{
    if(await probeLive()){
      const prev=S.days[date];
      const slugs = light && prev?.source==="live" ? [...new Set(prev.matches.map(m=>m.lg))] : null;
      const live=await loadLiveDay(date, slugs);
      const old=S.days[date]; const keep=new Map((old?.matches||[]).map(m=>[m.id,m.ds]));
      const before=new Map((old?.source==="live"||old?.source==="cache"?old.matches:[]).map(m=>[m.id,m]));
      for(const m of live.matches){
        const o=before.get(m.id); if(!o||m.st==="pre") continue;
        const gh=(m.h.score??0)-(o.h.score??0), ga=(m.a.score??0)-(o.a.score??0);
        if(gh>0||ga>0){ S.goals[m.id]=Date.now();
          if(S.favs[m.h.id]||S.favs[m.a.id]) toast(`ประตู! ${gh>0?m.h.short:m.a.short} · ${m.h.short} ${m.h.score}–${m.a.score} ${m.a.short}`); }
      }
      live.matches.forEach(m=>{ const d=keep.get(m.id); if(d) m.ds=d; });
      S.days[date]=prepare({...live, source:"live"});
      saveDay(date);
      if(!Shared.pulled[date] || Date.now()-Shared.pulled[date]>5*60e3) await syncPull(date);
      recordDay(date);
      if(date===bkkToday()) loadTrends(date,[...new Set(S.days[date].matches.map(m=>m.lg))]).then(ch=>{ if(ch&&S.days[date]){ S.days[date]=prepare({...S.days[date],matches:S.days[date].matches.map(x=>x.raw||x)}); if(!S.open) render(); } });
      if(S.open){ const nm=S.days[date].matches.find(x=>x.id===S.open.id); if(nm) updateSheetScore(nm); }
      if(manual) toast("ดึงข้อมูลสดจาก ESPN แล้ว");
    } else if(manual){
      toast("หน้านี้เชื่อมฟีด ESPN ไม่ได้ จึงใช้ข้อมูลชุดที่บันทึกไว้ เปิดจากเว็บที่ติดตั้งไว้เพื่อดูสด");
    }
  }catch{ S.err=new Date().toISOString(); if(manual) toast("ดึงข้อมูลใหม่ไม่สำเร็จ ใช้ชุดเดิมต่อ"); }
  S.loading=false;
  btn.classList.remove("spin");
  if(S.queued){ const q=S.queued; S.queued=null; if(q.date!==date||q.manual) return refresh(q.date,q.manual); }
  scheduleNext();
  render();
  if(S.liveOk && date===bkkToday()) prefetch(shiftDate(date,1));
}

async function prefetch(date){
  if(prefetched.has(date)||S.days[date]?.source==="live") return; prefetched.add(date);

}

function rollDay(){

  S.today=t;
}
/* auto update: every minute while a match is live or about to start, otherwise every 10 minutes */
let pollT;
function hotDay(day){ const now=Date.now(); return (day?.matches||[]).some(m=>m.st==="in"||(m.st==="pre"&&Date.parse(m.ko)-now<15*60e3&&now-Date.parse(m.ko)<3*3600e3)); }
function scheduleNext(){
  clearTimeout(pollT); S.nextMs=null; if(!S.liveOk) return;
  const ms=hotDay(S.days[S.date])?60e3:10*60e3; S.nextMs=ms;
  S.tick=(S.tick||0)+1;
  pollT=setTimeout(()=>{ if(document.visibilityState!=="visible") return scheduleNext(); rollDay(); refresh(S.date,false, ms<600e3 && S.tick%10!==0); },ms);
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  rollDay(); const d=S.days[S.date];
  if(S.liveOk && (!d?.fetchedAt || d.source!=="live" || Date.now()-Date.parse(d.fetchedAt)>60e3)) refresh(S.date,false); else render();
});

function pickStatus(p){

function spark(vals, color){

}

/* ---------- belief layer: Thai ทักษา + Chinese zodiac (shown beside the numbers, never inside them) ---------- */
const TAKSA_SEQ=[1,2,3,4,7,5,8,6]; // อาทิตย์ จันทร์ อังคาร พุธ เสาร์ พฤหัส ราหู ศุกร์
const TAKSA_ROLE=["บริวาร","อายุ","เดช","ศรี","มูละ","อุตสาหะ","มนตรี","กาลกิณี"];
const TAKSA_SCORE={"เดช":1,"ศรี":1,"มนตรี":1,"กาลกิณี":-1};
const THAI_DAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const ANIMALS=["ชวด (หนู)","ฉลู (วัว)","ขาล (เสือ)","เถาะ (กระต่าย)","มะโรง (มังกร)","มะเส็ง (งู)","มะเมีย (ม้า)","มะแม (แพะ)","วอก (ลิง)","ระกา (ไก่)","จอ (สุนัข)","กุน (หมู)"];
const SIX_HARMONY={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};
function taksa(birthIso, matchIso){
  const b=TAKSA_SEQ.indexOf(weekday(birthIso)+1), t=TAKSA_SEQ.indexOf(weekday(matchIso)+1);
  const role=TAKSA_ROLE[(t-b+8)%8]; return {role, score:TAKSA_SCORE[role]||0};
}
function yearBranch(iso){ const [y,mo,d]=iso.split("-").map(Number); const yy=(mo<2||(mo===2&&d<4))?y-1:y; return ((yy-4)%12+12)%12; }
function dayBranch(iso){ const [y,m,d]=iso.split("-").map(Number); const n=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1949,9,1))/864e5); return ((n%12)+12)%12; } // 1 ต.ค. 1949 = วันชวด (甲子)
function zodiacRel(b,d){
  if((b-d+12)%12===6) return {rel:"ชง ปะทะกับวัน",score:-1};
  if(SIX_HARMONY[b]===d) return {rel:"คู่มิตรกับวัน",score:1};
  if(b!==d&&b%4===d%4) return {rel:"สามประสานกับวัน",score:1};
  if(b===d) return {rel:"ปีเดียวกับวัน",score:.5};
  return {rel:"เป็นกลาง",score:0};
}
function personLuck(dob, matchIso){
  if(!dob||!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return null;
  const t=taksa(dob,matchIso), yb=yearBranch(dob), z=zodiacRel(yb,dayBranch(matchIso));
  return {bornDay:THAI_DAY[weekday(dob)], taksa:t.role, animal:ANIMALS[yb], zodiac:z.rel, score:(t.score+z.score)/2};
}
function teamLuck(m){
  const ext=S.ext[m.id]; if(!ext?.people) return null;
  const day=bkkDateOf(m.ko); const out={h:[],a:[]};
  ext.people.players.forEach(p=>{ const l=personLuck(p.dob,day); out[p.side].push({name:p.name,role:"นักเตะ",dob:p.dob,luck:l}); });
  ["h","a"].forEach(s=>{ const c=ext.people.coaches[s]; if(c) out[s].unshift({name:c.name,role:"ผู้จัดการทีม",dob:c.dob,luck:personLuck(c.dob,day)}); });
  const avg=list=>{ const v=list.filter(x=>x.luck).map(x=>x.luck.score); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };
  return {...out, hs:avg(out.h), as:avg(out.a)};
}

function formWord(f){ const p=formPPG(f); if(p==null) return null; return p>=2.2?"ฟอร์มร้อนแรง":p>=1.6?"ฟอร์มกำลังมา":p>=1?"ฟอร์มกลาง ๆ":"ฟอร์มสะดุด"; }
function sideStyle(s){
  if(!s||s.n<3) return "";
  const bits=[];
  if(s.gf/s.n>=2) bits.push("เกมรุกคมกริบ ยิงเฉลี่ยเกิน 2 ลูก"); else if(s.blank>=2) bits.push(`ปลายทางยังฝืด ยิงไม่ได้ ${s.blank} จาก ${s.n} นัด`);
  if(s.clean>=2) bits.push(`เกมรับเหนียว คลีนชีต ${s.clean} นัด`); else if(s.ga/s.n>=2) bits.push("แนวรับรั่วเสียเฉลี่ย 2 ลูกขึ้นไป");
  return bits.join(" และ");
}
function leanOf(m){

  if(d>=.30) return {title:`${fav} เต็งหนึ่งชัด`,tone:"strong",fav};

  if(m.sum.draw>=.28) return {title:"สูสี ลุ้นเสมอสูง",tone:"even",fav:null};
  return {title:`สูสี ${fav} เหนือกว่าเล็กน้อย`,tone:"even",fav};
}

function scorerLuck(m){
  const people=S.ext[m.id]?.people?.players||[], day=bkkDateOf(m.ko), byName={}, list=[];
  for(const s of m.scorers?.list||[]){
    const pp=people.find(x=>x.name===s.name); const l=pp?.dob?personLuck(pp.dob,day):null;
    if(l){ byName[s.name]=l; list.push({...s,luck:l,assistLean:s.pAssist>s.pGoal}); }
  }
  list.sort((a,b)=>b.luck.score-a.luck.score||b.pGoal-a.pGoal);
  return {byName, list, best:list.find(x=>x.luck.score>0)||null};
}

/* news-based adjustments returned by the daily brief */
function applyBriefAdj(date){
  const b=store.get("brief:"+date,null), day=S.days[date]; if(!day?.matches?.length) return;
  let changed=false;
  for(const m of day.matches) if(S.newsAdj[m.id]){ delete S.newsAdj[m.id]; changed=true; }
  for(const a of b?.adjust||[]){
    const key=String(a.match||"").toLowerCase();
    const m=day.matches.find(x=>key.includes(x.h.short.toLowerCase())&&key.includes(x.a.short.toLowerCase())); if(!m) continue;
    const e=Math.max(-.05,Math.min(.03,Number(a.effect)||0)); if(!e) continue;
    const cur=S.newsAdj[m.id]||{h:0,a:0,reason:""}; cur[a.team==="away"?"a":"h"]+=e; cur.reason=[cur.reason,String(a.reason||"").slice(0,140)].filter(Boolean).join(" · ");
    S.newsAdj[m.id]=cur; changed=true;
    const tid=a.team==="away"?m.a.id:m.h.id; S.newsTeam[tid]={e,reason:String(a.reason||"").slice(0,120),d:date}; store.set("newsTeam",S.newsTeam);
  }
  if(changed) S.days[date]=prepare({...day, matches:day.matches.map(x=>x.raw||x)});
}

/* ---------- AI brief ---------- */
async function runBrief(){
  const day=getDay(S.date); if(!day.matches.length) return;
  S.briefBusy=true; S.briefErr=""; render();
  try{
    const sample = window.claude ? await window.claude.use("sample") : null;
    const data=day.matches.slice(0,30).map(m=>({match:`${m.h.short} - ${m.a.short}`,teams:[m.h.name,m.a.name],homeId:m.h.id,awayId:m.a.id,league:lg(m),kickoffThai:kickTime(m.ko),state:m.st,
      model:{home:+m.sum.home.toFixed(3),draw:+m.sum.draw.toFixed(3),away:+m.sum.away.toFixed(3),over25:+m.sum.over25.toFixed(3),likely:`${m.sum.top[0].h}-${m.sum.top[0].a}`,lambda:[+m.lh.toFixed(2),+m.la.toFixed(2)]},
      handicap:m.mk?.spread?ahPhrase(m.h.short,m.a.short,m.mk.spread.line):null, bestEdge:(b=>b?{label:b.label,points:+(b.edge*100).toFixed(1)}:null)(bestEdge(m)),
      form:[m.h.form,m.a.form], h2hMeetings:m.meets.length}));
    if(!sample){
      let out;
      try{ out=await getJson("/api/brief",60000,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:S.date,matches:data})}); }
      catch{ S.briefErr="ยังเรียกบทวิเคราะห์ไม่ได้ ตรวจว่าใส่ ANTHROPIC_API_KEY ใน Vercel แล้ว"; return; }
      if(out?.error){ S.briefErr=out.error; return; }
      store.set("brief:"+S.date,{at:new Date().toISOString(),summary:String(out.summary||"").slice(0,900),notes:(out.notes||[]).slice(0,6),players:(out.players||[]).slice(0,7),headlines:(out.headlines||[]).slice(0,12),adjust:(out.adjust||[]).slice(0,10)});
      applyBriefAdj(S.date);
      return;
    }
    const prompt=`คุณคือนักวิเคราะห์สถิติฟุตบอลของแอป Goal Club เขียนภาษาไทยทั้งหมด
ข้อมูลด้านล่างคือผลโมเดลปัวซง/ดิกสัน-โคลส์และราคาตลาดของวันที่ ${S.date} ใช้เฉพาะตัวเลขในข้อมูลนี้ ห้ามแต่งข่าว ชื่อนักเตะ อาการบาดเจ็บ หรือตัวเลขที่ไม่มีในข้อมูล ห้ามชวนเดิมพัน ห้ามอ้างว่าแม่นหรือชัวร์
ตอบเป็น JSON เท่านั้น รูปแบบ {"summary": "ภาพรวมของวัน 2-3 ประโยค", "notes": [{"match": "ทีม - ทีม", "text": "หนึ่งประโยคว่าตัวเลขบอกอะไร"}]} ใส่ notes 3-5 คู่ที่น่าสนใจที่สุด
ข้อมูล: ${JSON.stringify(data)}`;
    const out=await sample.json(prompt,{modelTier:"default"});
    if(!out||typeof out.summary!=="string") throw {message:"bad"};
    store.set("brief:"+S.date,{at:new Date().toISOString(),summary:out.summary.slice(0,600),notes:(Array.isArray(out.notes)?out.notes:[]).slice(0,5).map(n=>({match:String(n.match||"").slice(0,60),text:String(n.text||"").slice(0,240)}))});
  }catch(e){
    S.briefErr = e?.code==="not_granted" ? "ยังไม่ได้อนุญาตให้หน้านี้ถาม Claude" : e?.code==="rate_limited" ? "เรียกบ่อยเกินไป รอสักครู่แล้วลองใหม่" : "วิเคราะห์ไม่สำเร็จ ลองอีกครั้ง";
  }finally{ S.briefBusy=false; render(); }
}

/* ---------- chrome: status, dates, tabs ---------- */
const TABS=[["home","หน้าหลัก",'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>'],["schedule","โปรแกรม",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],["analyze","วิเคราะห์",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],["saved","ทีมโปรด",'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'],["more","เพิ่มเติม",'<path d="M4 6h16M4 12h16M4 18h16"/>']];
const DATED_TABS=new Set(["home","schedule","analyze"]);
function statusText(){
  const day=getDay(S.date);
  if(S.loading===S.date) return `<span class="dot live pulse"></span><span>กำลังอัปเดตข้อมูลสด…</span>`;
  if(S.err && day.source!=="snapshot") return `<span class="dot bad"></span><span>เชื่อมต่อไม่ได้ · ข้อมูลเมื่อ ${kickTime(day.fetchedAt||S.err)} · จะลองใหม่เอง</span>`;
  if(day.source==="live") return `<span class="dot live"></span><span>สดจาก ESPN · อัปเดต ${kickTime(day.fetchedAt)}${S.nextMs?` · ทุก ${S.nextMs>=600e3?"10 นาที":"1 นาที"}`:""}</span>`;
  if(day.source==="cache") return `<span class="dot"></span><span>ข้อมูลที่ดึงไว้ · ${stampTime(day.fetchedAt)}${S.liveOk===null?" · กำลังเชื่อมฟีดสด…":""}</span>`;
  if(day.source==="snapshot") return `<span class="dot"></span><span>ข้อมูลชุดที่บันทึกไว้ · ${stampTime(day.fetchedAt)}</span>`;
  return `<span class="dot"></span><span>ยังไม่มีข้อมูลของ${relLabel(S.date)}</span>`;
}
function paintStatus(){ const el=$("#status"); if(el) el.innerHTML=statusText(); }
const CAL_ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function paintDates(){
  const show=DATED_TABS.has(S.tab);
  $("#dateRow").hidden=!show; $("#statusRow").hidden=!show; $("#filterPanel").hidden=!show||!S.filterOpen;
  if(!show) return;
  const el=$("#dates");
  const t=bkkToday(); const set=new Set([shiftDate(t,-1),t,shiftDate(t,1),shiftDate(t,2),shiftDate(t,3),S.date]);
  Object.keys(SNAPSHOT||{}).filter(d=>d>=shiftDate(t,-1)).forEach(d=>set.add(d));
  const TH_DAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
  const html=[...set].sort().map(d=>{
    const day=S.days[d]||((SNAPSHOT||{})[d]?getDay(d):null); const n=day?.matches?.length||0; const live=day?.matches?.some(m=>m.st==="in");
    const rel=relLabel(d), lbl=dayLabel(d).split(" ").slice(1).join(" ");
    const top=["วันนี้","พรุ่งนี้","เมื่อวาน"].includes(rel)?rel:TH_DAY[weekday(d)];
    return `<button class="dchip ${d===S.date?"on":""}${live?" has-live":""}" role="tab" aria-selected="${d===S.date}" data-date="${d}"><span class="d1">${CAL_ICON}${top}</span><span class="d2 num">${lbl}${n?` · ${n} คู่`:""}</span></button>`;
  }).join("");
  if(el.dataset.html!==html){ el.innerHTML=html; el.dataset.html=html; el.querySelector(".on")?.scrollIntoView({inline:"center",block:"nearest"}); }
  $("#datePick").value=S.date;
  const fb=$("#btnFilter"); fb.setAttribute("aria-expanded",String(S.filterOpen)); fb.querySelector(".fdot").hidden=!(S.league||S.status!=="all");
  if(S.filterOpen){
    const day=getDay(S.date), base=filtered({matches:day.matches}), cnt=k=>base.filter(m=>k==="all"||m.st===k).length;
    $("#filterPanel").innerHTML=seg("status",[["all","ทั้งหมด",cnt("all")],["in","สด",cnt("in")],["pre","ยังไม่เตะ",cnt("pre")],["post","จบแล้ว",cnt("post")]],S.status)+leagueSelect(day);
  }
}
function paintTabs(){
  const liveN=(S.days[S.date]?.matches||[]).filter(m=>m.st==="in").length;
  $("#tabs").innerHTML=TABS.map(([k,l,ic])=>`<a href="#${k}" class="${S.tab===k?"on":""}" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${ic}</svg>${l}${k==="schedule"&&liveN?`<span class="badge-n num">${liveN}</span>`:""}</a>`).join("");
}
function render(){
  if(S.adjFor!==S.date+":"+(S.days[S.date]?.fetchedAt||"")){ S.adjFor=S.date+":"+(S.days[S.date]?.fetchedAt||""); applyBriefAdj(S.date); }
  paintStatus(); paintDates(); paintTabs();
  if(S.recFor!==S.adjFor){ S.recFor=S.adjFor; recordDay(S.date); }
  if(S.open) return; // board refreshes after the sheet closes
  const v={home:viewHome,schedule:viewSchedule,analyze:viewAnalyze,saved:viewSaved,more:viewMore}[S.tab]||viewHome;
  $("#view").innerHTML=v();
}
function goTab(tab){ S.tab=tab; try{ history.replaceState(null,"","#"+tab); }catch{} render(); window.scrollTo({top:0}); }
function setDate(d){ S.date=d; S.league=""; if(Shared.on && !Shared.pulled[d]) syncPull(d).then(ok=>{ if(ok&&!S.open) render(); }); render(); window.scrollTo({top:0}); const day=S.days[d]; if(S.liveOk && (day?.source!=="live" || Date.now()-Date.parse(day.fetchedAt)>60e3)) refresh(d,false); else if(S.liveOk) scheduleNext(); }
function toggleFav(id){
  const m=(S.open&&S.open.id===id)?S.open:Object.values(S.days).flatMap(d=>d.matches).find(x=>x.id===id); if(!m) return;
  if(isFav(m)){ delete S.favs[m.h.id]; delete S.favs[m.a.id]; toast("เอาออกจากทีมโปรดแล้ว"); }
  else { S.favs[m.h.id]=m.h.short; S.favs[m.a.id]=m.a.short; toast(`เพิ่ม ${m.h.short} และ ${m.a.short} ในทีมโปรดแล้ว`); }
  store.set("favs",S.favs);
  if(S.open) paintSheet();
  render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("#btnFilter,[data-drawer],[data-fav],[data-open],[data-date],[data-set],[data-goto],[data-act],[data-unfav],[data-tab],#btnBrief,#btnAna,#btnBack,#btnSearch,#btnRefresh");
  if(!t) return;
  const d=t.dataset;
  if(t.id==="btnFilter"){ S.filterOpen=!S.filterOpen; return render(); }
  if(d.drawer){ S.drawer[d.drawer]=!S.drawer[d.drawer]; store.set("drawer2",S.drawer); return render(); }
  if(d.act==="picksAll"){ S.picksAll=!S.picksAll; return render(); }
  if(d.fav){ e.stopPropagation(); e.preventDefault(); return toggleFav(d.fav); }
  if(t.id==="btnBack") return closeSheet();
  if(d.open) return openMatch(d.open, d.day);
  if(d.date) return setDate(d.date);
  if(d.set){
    const [k,v]=d.set.split(":"); S[k]=v;
    if(k==="style") store.set("style",v);
    if(k==="sheetTab"||(S.open&&k==="style")) return paintSheet();
    return render();
  }
  if(d.goto){ const [tab,sub]=d.goto.split(":"); if(tab==="schedule"&&sub) S.status=sub; if(tab==="analyze"&&sub) S.mode=sub; return goTab(tab); }
  if(d.unfav){ delete S.favs[d.unfav]; store.set("favs",S.favs); return render(); }
  if(d.tab){ e.preventDefault(); return goTab(d.tab); }
  if(d.act==="refresh"){ S.liveOk=null; return refresh(S.date,true); }
  if(d.act==="clear"){ try{ Object.keys(localStorage).filter(k=>k.startsWith("gc:day:")||k.startsWith("gc:brief:")).forEach(k=>localStorage.removeItem(k)); }catch{} toast("ล้างข้อมูลที่เก็บไว้แล้ว ทีมโปรดยังอยู่"); S.liveOk=null; return refresh(S.date,false); }
  if(t.id==="btnBrief") return runBrief();
  if(t.id==="btnAna") return runAnalysis();
  if(t.id==="btnSearch"){ const r=$("#searchRow"); r.hidden=!r.hidden; if(!r.hidden) $("#q").focus(); else { S.q=""; $("#q").value=""; render(); } return; }
  if(t.id==="btnRefresh"){ S.liveOk=null; return refresh(S.date,true); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && S.open) return closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.matches?.(".mcard[role=button],.pcard[role=button]")){ e.preventDefault(); openMatch(e.target.dataset.open); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ clearTimeout(S.qT); S.qT=setTimeout(()=>{ S.q=e.target.value.trim(); render(); },160); }
  if(["cHome","cAway","tOver","tUnder"].includes(e.target.id)) runCalc();
});
document.addEventListener("change",e=>{
  if(e.target.id==="datePick"&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return setDate(e.target.value);
  if(e.target.id==="leagueSel"){ S.league=e.target.value; render(); }
  if(["cLine","tLine"].includes(e.target.id)) runCalc();
});
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(TABS.some(([k])=>k===h)) S.tab=h;
  if(h.startsWith("match-")){ const id=h.slice(6); const d=[...Object.keys(S.days),...Object.keys(SNAPSHOT||{})].find(d=>getDay(d).matches.some(m=>m.id===id)); if(d){ render(); openMatch(id,d); return true; } }
  return false;
}
window.addEventListener("hashchange",()=>{ if(S.open) return; if(!fromHash()) render(); });

/* ---------- boot ---------- */
(function start(){
  const t=bkkToday(); S.today=t; S.calib=computeCalib();
  if(!getDay(t).matches.length && !store.get("day:"+t,null)){ const ds=Object.keys(SNAPSHOT||{}).sort(); const near=ds.find(d=>d>=t)||ds[ds.length-1]; if(near) S.date=near; }
  if(!fromHash()) render();
  probeLive().then(async ok=>{ if(ok && S.date!==t && !getDay(t).matches.length) S.date=t; if(ok && await syncPull(S.date)) render(); refresh(S.date,false); });
  if("serviceWorker" in navigator && location.protocol==="https:" && !window.claude){ try{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }catch{} }
})();
</script>
