<style>
/* Layout: one phone-width column (max 640px), sticky gold-ruled header, fixed 5-tab bar, match sheet slides over the board */
:root{
  --bg:#0c0b09; --surface:#16140f; --surface-2:#221e17; --line:#3c3428;
  --fg:#f7f1e6; --muted:#b5aa9a; --faint:#7d7365;
  --gold:#f0cc86; --gold-deep:#c9a35b; --gold-ink:#1c1408;
  --win:#8fc79a; --draw:#d9c48a; --loss:#e08b7a;
  --font-display:"Taviraj","Sarabun",Georgia,serif;
  --font-body:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--font-display);font-weight:500;letter-spacing:.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in srgb,var(--gold) 22%,transparent)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--gold);line-height:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{padding-bottom:10px}
.search input{width:100%;height:42px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0 14px}
.status{font-size:12px;color:var(--faint);padding-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-deep);display:inline-block}
.dot.live{background:var(--win)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip .n{font-size:11px;opacity:.75}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
h2.sec{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--gold);margin:22px 0 10px;text-wrap:balance}
h2.sec small{font-family:var(--font-body);font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}
.rule{height:1px;width:72px;background:var(--gold);margin-top:10px}

/* hero */
.hero{position:relative;border-radius:var(--r-lg);padding:20px 20px 18px;background:linear-gradient(160deg,#2a2218 0%,#14110d 70%);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 34%,transparent);overflow:hidden;margin-top:6px}
.hero .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold-deep);font-weight:600}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05;margin:6px 0 2px;color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:30ch;position:relative}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero .tags span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--fg)}
.ball{position:absolute;right:-34px;top:-30px;width:124px;height:124px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3cf 0%,#f0cc86 26%,#b98a3c 62%,#5b3f17 100%);opacity:.92}
.ball::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 18deg,transparent 0 52deg,rgba(28,20,8,.28) 52deg 72deg,transparent 72deg 124deg,rgba(28,20,8,.28) 124deg 144deg,transparent 144deg 196deg,rgba(28,20,8,.28) 196deg 216deg,transparent 216deg 268deg,rgba(28,20,8,.28) 268deg 288deg,transparent 288deg 340deg,rgba(28,20,8,.28) 340deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 31%);mask:radial-gradient(circle,transparent 30%,#000 31%)}

/* cards */
.card{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:14px}
.card.gold{background:linear-gradient(180deg,#221c14 0%,#14110d 100%);border-color:color-mix(in srgb,var(--gold) 32%,transparent)}
.match{display:block;width:100%;text-align:left}
.match:hover{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.mhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mhead .lg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--faint)}
.star.on{color:var(--gold)}
.star.on svg{fill:var(--gold)}
.teams{display:grid;grid-template-columns:1fr auto;gap:8px 10px;margin-top:8px;align-items:center}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team .rk{font-size:11px;color:var(--faint);flex:none}
.badge{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:#1a140c}
.score{font-family:var(--font-display);font-size:22px;color:var(--fg);text-align:right;min-width:24px}
.pills{display:flex;gap:3px;flex:none}
.pill{width:16px;height:16px;border-radius:4px;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#14100a}
.pill.W{background:var(--win)} .pill.D{background:var(--draw)} .pill.L{background:var(--loss)}
.probbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:12px;background:var(--surface-2)}
.probbar i{display:block;height:100%}
.probbar .h{background:var(--gold)} .probbar .d{background:#6e6250} .probbar .a{background:#e8e0d2}
.problabels{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;color:var(--muted)}
.problabels b{color:var(--fg);font-weight:600}
.mfoot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.mfoot b{color:var(--gold);font-weight:600}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.tag.value{background:color-mix(in srgb,var(--win) 20%,transparent);color:var(--win)}
.tag.live{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.tag.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}

.btn{height:42px;padding:0 16px;border-radius:var(--r-md);background:var(--gold);color:var(--gold-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:28px 16px}
.empty .serif{font-size:20px;color:var(--gold)}

/* list rows */
.list{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-size:13px;color:var(--muted)}
.li .mid{min-width:0}
.li .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;font-size:13px}
.grouphead{padding:9px 14px;font-size:12px;letter-spacing:.06em;color:var(--gold-deep);background:var(--surface-2);font-weight:600;display:flex;justify-content:space-between}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}

.scroll-x{overflow-x:auto}

.face .badge{width:56px;height:56px;font-size:16px;margin:0 auto 8px}
.face .nm{font-weight:600;line-height:1.25;text-wrap:balance}
.face .mid{font-family:var(--font-display);font-size:30px;color:var(--gold);line-height:1}
.face .mid small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv > div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.kv .k{font-size:11.5px;color:var(--faint)}
.kv .v{font-size:18px;font-weight:600;color:var(--fg)}
.kv .v.gold{color:var(--gold)}
.grid6{display:grid;grid-template-columns:28px repeat(6,1fr);gap:3px;font-size:11.5px}
.grid6 span{display:grid;place-items:center;height:30px;border-radius:5px}
.grid6 .hd{color:var(--faint)}
.statgrid{display:grid;grid-template-columns:1fr auto auto;gap:0;font-size:13px}
.statgrid > *{padding:8px 0;border-top:1px solid var(--line)}
.statgrid > .h{border-top:0;color:var(--faint);font-size:11.5px}
.statgrid > :nth-child(3n+2),.statgrid > :nth-child(3n){text-align:right;padding-left:14px}
.form-lines{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.form-lines span{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--surface-2)}
.note{font-size:12.5px;color:var(--faint);margin-top:8px}
.omen{border:1px dashed color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r-lg);padding:14px;background:transparent}
.swatch{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-4px;margin-right:6px;border:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--faint);min-width:0;flex:1}

.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.out{margin-top:10px;font-size:13.5px}
.brief p{margin:6px 0 0}
.brief ul{margin:8px 0 0;padding-left:18px}
.brief li{margin:4px 0}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin:0 0 10px}
ol.steps b{color:var(--gold)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

</style>

/* ---------- model: Poisson + Dixon-Coles (rho -0.08) ---------- */
const RHO = -0.08, MAXG = 10;
const clamp = (n,a,b) => Math.min(b, Math.max(a, n));
function formPPG(form){
  const c = (form||"").toUpperCase().replace(/[^WDL]/g,""); if(!c) return null;
  let w=0,s=0; for(let i=0;i<c.length;i++){ const wt=(i+1)/c.length; w += (c[i]==="W"?3:c[i]==="D"?1:0)*wt; s+=wt; } return w/s;
}
function formNudge(form){ const p=formPPG(form); if(p==null) return 1; return clamp(1+((p-1.4)/1.4)*0.12, 0.82, 1.18); }
function formGoals(form){ const p=formPPG(form); if(p==null) return {score:1.28,concede:1.28}; return {score:0.75+(p/3)*1.3, concede:1.85-(p/3)*0.9}; }
const PRIOR = 8;
const shrunk = (count,played,avg) => (count + avg*PRIOR)/(played + PRIOR);
const hasTable = s => s.played!=null && s.played>=3 && s.gf!=null && s.ga!=null;
function baseLambdas(h, a, avg){
  const ht=hasTable(h), at=hasTable(a); avg = avg && avg>0.4 ? avg : null;
  const att = s => clamp(shrunk(s.gf,s.played,avg)/avg,0.4,2.2)*formNudge(s.form);
  const def = s => clamp(shrunk(s.ga,s.played,avg)/avg,0.4,2.2)/formNudge(s.form);
  if(avg && ht && at) return {lh:clamp(att(h)*def(a)*avg*1.18,0.15,4.2), la:clamp(att(a)*def(h)*avg*0.9,0.15,4.2), basis:"table"};
  if(avg && (ht||at)){
    const fo = s => { const f=formGoals(s.form); return {att:clamp(f.score/avg,0.35,2.6), def:clamp(f.concede/avg,0.35,2.6)}; };
    const H = ht ? {att:att(h),def:def(h)} : fo(h), A = at ? {att:att(a),def:def(a)} : fo(a);
    return {lh:clamp(H.att*A.def*avg*1.18,0.15,4.2), la:clamp(A.att*H.def*avg*0.9,0.15,4.2), basis:"blend"};
  }
  const hf=formGoals(h.form), af=formGoals(a.form);
  return {lh:clamp(hf.score*(af.concede/1.28)*1.1,0.15,4.2), la:clamp(af.score*(hf.concede/1.28)*0.92,0.15,4.2), basis:"form"};
}
function pmf(k,l){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function grid(lh,la){
  const g=[]; let s=0;
  for(let h=0;h<=MAXG;h++){ g[h]=[]; for(let a=0;a<=MAXG;a++){
    let p=pmf(h,lh)*pmf(a,la);
    if(h===0&&a===0) p*=1-lh*la*RHO; else if(h===0&&a===1) p*=1+lh*RHO; else if(h===1&&a===0) p*=1+la*RHO; else if(h===1&&a===1) p*=1-RHO;
    g[h][a]=Math.max(0,p); s+=g[h][a]; } }
  for(const r of g) for(let a=0;a<r.length;a++) r[a]/=s;
  return g;
}
function summarize(g){
  let home=0,draw=0,away=0,over=0,btts=0; const cells=[];
  g.forEach((r,h)=>r.forEach((p,a)=>{ if(h>a) home+=p; else if(h===a) draw+=p; else away+=p; if(h+a>=3) over+=p; if(h>0&&a>0) btts+=p; cells.push({h,a,p}); }));
  cells.sort((x,y)=>y.p-x.p);
  return {home,draw,away,over25:over,under25:1-over,btts,top:cells.slice(0,5)};
}
function atomic(line){ const t=Math.round(line*4); const s=t/4; return t%2===0 ? [{line:s,w:1}] : [{line:(t-1)/4,w:.5},{line:(t+1)/4,w:.5}]; }
function hdpSplit(g, homeLine){
  let win=0,push=0,lose=0;
  for(const part of atomic(homeLine)){ g.forEach((r,h)=>r.forEach((p,a)=>{ const m=h+part.line-a; if(m>1e-9) win+=p*part.w; else if(m<-1e-9) lose+=p*part.w; else push+=p*part.w; })); }
  return {win,push,lose};
}
function totSplit(g, line){
  let over=0,push=0,under=0;
  for(const part of atomic(line)){ g.forEach((r,h)=>r.forEach((p,a)=>{ const t=h+a; if(t>part.line+1e-9) over+=p*part.w; else if(t<part.line-1e-9) under+=p*part.w; else push+=p*part.w; })); }
  return {over:{win:over,push,lose:under}, under:{win:under,push,lose:over}};
}
const cover = s => (s.win+s.lose)>0 ? s.win/(s.win+s.lose) : .5;
function devig(ds){ if(ds.some(d=>!(d>1.01))) return null; const imp=ds.map(d=>1/d), s=imp.reduce((x,y)=>x+y,0); return imp.map(v=>v/s); }

function fmtPrice(dec, style){
  if(!(dec>1.01)) return "–";

  if(style==="malay"){ const m = dec>=2 ? -(1/(dec-1)) : dec-1; return (m<0?"-":"")+Math.abs(m).toFixed(2); }

function toDecimal(raw, style){
  if(!Number.isFinite(raw) || raw===0) return null;
  if(style==="decimal") return raw>1.01 ? raw : null;
  if(style==="hongkong") return raw>0 ? raw+1 : null;
  if(raw>0 && raw<=1) return 1+raw;
  if(raw<0 && raw>=-1) return 1+1/Math.abs(raw);

}

function linesStats(lines){

function meetingsFor(m){

function refine(m){

/* market rows: model vs de-vigged market */
function edgeRows(m){
  const mk=m.mk, rows=[]; if(!mk) return rows;
  if(mk.home&&mk.draw&&mk.away){
    const fair=devig([mk.home.decimal,mk.draw.decimal,mk.away.decimal]);
    [["1x2-h",`${m.h.short} ชนะ`,m.sum.home,mk.home],["1x2-d","เสมอ",m.sum.draw,mk.draw],["1x2-a",`${m.a.short} ชนะ`,m.sum.away,mk.away]]
      .forEach(([key,label,model,price],i)=>rows.push({key,kind:"1x2",label,model,fair:fair?.[i]??null,edge:fair?model-fair[i]:null,dec:price.decimal}));
  }
  if(mk.spread){
    const s=hdpSplit(m.g,mk.spread.line), aw={win:s.lose,lose:s.win,push:s.push};
    const f=devig([mk.spread.home.decimal,mk.spread.away.decimal]);
    rows.push({key:"ah-h",kind:"ah",label:`${m.h.short} ${signed(mk.spread.line)}`,model:cover(s),fair:f?.[0]??null,edge:f?cover(s)-f[0]:null,dec:mk.spread.home.decimal,split:s});
    rows.push({key:"ah-a",kind:"ah",label:`${m.a.short} ${signed(-mk.spread.line)}`,model:cover(aw),fair:f?.[1]??null,edge:f?cover(aw)-f[1]:null,dec:mk.spread.away.decimal,split:aw});
  }
  if(mk.total){
    const t=totSplit(m.g,mk.total.line), f=devig([mk.total.over.decimal,mk.total.under.decimal]);
    rows.push({key:"ou-o",kind:"ou",label:`สูง ${ballLabel(mk.total.line)}`,model:cover(t.over),fair:f?.[0]??null,edge:f?cover(t.over)-f[0]:null,dec:mk.total.over.decimal});
    rows.push({key:"ou-u",kind:"ou",label:`ต่ำ ${ballLabel(mk.total.line)}`,model:cover(t.under),fair:f?.[1]??null,edge:f?cover(t.under)-f[1]:null,dec:mk.total.under.decimal});
  }
  return rows;
}
function signed(line){ const s=Math.round(line*4)/4; if(Math.abs(s)<.01) return "0"; return (s>0?"+":"-")+ballLabel(Math.abs(s)); }
function bestEdge(m){ return edgeRows(m).filter(r=>r.edge!=null).sort((a,b)=>b.edge-a.edge)[0]||null; }

/* picks: up to 5 market AH lines where the model is most confident */
function lockPicks(matches){
  const c=[];
  for(const m of matches){
    if(m.st!=="pre"||!m.mk?.spread) continue;
    const line=m.mk.spread.line, s=hdpSplit(m.g,line), hc=cover(s), ac=1-hc;
    const homeSide = hc>=ac, cv=Math.max(hc,ac);
    if(cv<0.56) continue;
    const top=m.sum.top[0];
    c.push({m, cv, side:homeSide?"h":"a", phrase:ahPhrase(m.h.short,m.a.short,line), take: homeSide?`${m.h.short} ${signed(line)}`:`${m.a.short} ${signed(-line)}`, score:`${top.h}-${top.a}`});
  }
  return c.sort((a,b)=>b.cv-a.cv).slice(0,5);
}

/* ESPN routes: first our own server proxy (/api/espn on Vercel), then ESPN directly. Whichever answers first is remembered. */
const ESPN_ROUTES=[
  p=>`/api/espn?path=${encodeURIComponent(p.split("?")[0])}${p.includes("?")?"&"+p.split("?")[1]:""}`,
  p=>`https://site.api.espn.com/apis/${p}`

let espnRoute=null;
async function espn(path, ms=6000){
  if(espnRoute) return getJson(espnRoute(path), ms);
  let last;

  throw last||new Error("feed");
}
function readAmerican(v){ const n=typeof v==="number"?v:Number(String(v??"").replace("+","").trim()); return Number.isFinite(n)&&n!==0?n:null; }

function priceOf(side){ const n=side?.close?.odds!=null?side.close:side?.open; const d=amToDec(readAmerican(n?.odds)); return d?{decimal:d}:null; }

function parseMarket(o){
  if(!o) return null;
  const home=priceOf(o.moneyline?.home), away=priceOf(o.moneyline?.away), draw=priceOf(o.moneyline?.draw);
  const sl=lineOf(o.pointSpread?.home), sh=priceOf(o.pointSpread?.home), sa=priceOf(o.pointSpread?.away);
  const tl=lineOf(o.total?.over)??lineOf(o.total?.under), ov=priceOf(o.total?.over), un=priceOf(o.total?.under);
  const mk={book:o.provider?.displayName||o.provider?.name||"ตลาด",home,draw,away,
    spread: sl!=null&&sh&&sa?{line:sl,home:sh,away:sa}:null, total: tl!=null&&ov&&un?{line:tl,over:ov,under:un}:null};

}

}

function statRows(m){
  const r=(label,f)=>`<span>${label}</span><span class="num">${f(m.hs)}</span><span class="num">${f(m.as)}</span>`;
  const fr=(s,k)=>s?`${s[k]}/${s.n}`:"–";
  const meet=m.meets; const mm=meet.length?{n:meet.length,btts:meet.filter(x=>x.f>0&&x.a>0).length,over:meet.filter(x=>x.f+x.a>=3).length}:null;
  return `<div class="statgrid"><span class="h">5 นัดหลัง</span><span class="h">${esc(m.h.short)}</span><span class="h">${esc(m.a.short)}</span>
    ${r("ทั้งยิงทั้งเสีย",s=>fr(s,"btts"))}${r("สูง 2.5",s=>fr(s,"over"))}${r("คลีนชีต",s=>fr(s,"clean"))}${r("ยิงไม่ได้",s=>fr(s,"blank"))}
    ${r("ยิง / เสีย",s=>s?`${s.gf} / ${s.ga}`:"–")}</div>
    ${mm?`<p class="note">นัดที่เคยเจอ ${mm.n} นัด: ทั้งยิงทั้งเสีย ${mm.btts} นัด · สูง 2.5 ${mm.over} นัด</p>`:""}`;
}
function omen(m){
  const d=bkkDateOf(m.ko); const wd=weekday(d);
  const COL=[["แดง","#c8463a"],["เหลือง","#e3c24b"],["ชมพู","#e59ab4"],["เขียว","#4f9a5f"],["ส้ม","#e08a3c"],["ฟ้า","#5d9bd6"],["ม่วง","#8a64b8"]];
  const DAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  const ELEM=["ไฟ","ดิน","ไฟ","น้ำ","ดิน","น้ำ","ดิน"];
  const digits=d.replaceAll("-","").split("").map(Number); let n=digits.reduce((a,b)=>a+b,0); while(n>9) n=String(n).split("").map(Number).reduce((a,b)=>a+b,0);

async function openMatch(id, date){
  if(date && date!==S.date){ S.date=date; }
  const day=getDay(S.date); let m=day.matches.find(x=>x.id===id);
  if(!m){ for(const d of Object.keys(S.days)){ m=S.days[d].matches.find(x=>x.id===id); if(m) break; } }
  if(!m) return;
  S.open=m; const sh=$("#sheet"); sh.innerHTML=sheetHtml(m); sh.hidden=false; sh.scrollTop=0; document.body.style.overflow="hidden"; runCalc();
  try{ history.replaceState(null,"","#match-"+id); }catch{}
  if(!m.ds && S.liveOk){
    const ds=await loadLiveDossier(m);
    if(ds && S.open?.id===id){ const idx=day.matches.indexOf(m); const nm=refine({...m.raw, ds}); if(idx>=0) day.matches[idx]=nm; S.open=nm; sh.innerHTML=sheetHtml(nm); runCalc(); }
    else if(!ds){ const el=$("#dsLoading"); if(el) el.textContent="ดึงสถิติเชิงลึกไม่สำเร็จ"; }
  }
}
function closeSheet(){ $("#sheet").hidden=true; $("#sheet").innerHTML=""; S.open=null; document.body.style.overflow=""; try{ history.replaceState(null,"","#"+S.tab); }catch{} render(); }

      model:{home:+m.sum.home.toFixed(3),draw:+m.sum.draw.toFixed(3),away:+m.sum.away.toFixed(3),over25:+m.sum.over25.toFixed(3),likely:`${m.sum.top[0].h}-${m.sum.top[0].a}`,lambda:[+m.lh.toFixed(2),+m.la.toFixed(2)]},
      handicap:m.mk?.spread?ahPhrase(m.h.short,m.a.short,m.mk.spread.line):null, bestEdge:(b=>b?{label:b.label,points:+(b.edge*100).toFixed(1)}:null)(bestEdge(m)),
      form:[m.h.form,m.a.form], h2hMeetings:m.meets.length}));
    if(!sample){
      let out;
      try{ out=await getJson("/api/brief",60000,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:S.date,matches:data})}); }
      catch{ S.briefErr="ยังเรียกบทวิเคราะห์ไม่ได้ ถ้าเปิดจากเว็บที่ติดตั้งเอง ให้ใส่ ANTHROPIC_API_KEY ในตั้งค่า Vercel"; return; }
      if(out?.error){ S.briefErr=out.error; return; }
      store.set("brief:"+S.date,{at:new Date().toISOString(),summary:String(out.summary||"").slice(0,600),notes:(out.notes||[]).slice(0,5),players:(out.players||[]).slice(0,7),headlines:(out.headlines||[]).slice(0,12)});
      return;
    }

ข้อมูลด้านล่างคือผลโมเดลปัวซง/ดิกสัน-โคลส์และราคาตลาดของวันที่ ${S.date} (เวลาไทย) ใช้เฉพาะตัวเลขในข้อมูลนี้ ห้ามแต่งข่าว ชื่อนักเตะ อาการบาดเจ็บ หรือตัวเลขที่ไม่มีในข้อมูล ห้ามชวนเดิมพัน ห้ามอ้างว่าแม่นหรือชัวร์
ตอบเป็น JSON เท่านั้น รูปแบบ {"summary": "ภาพรวมของวัน 2-3 ประโยค", "notes": [{"match": "ทีม - ทีม", "text": "หนึ่งประโยคว่าตัวเลขบอกอะไร"}]} ใส่ notes 3-5 คู่ที่น่าสนใจที่สุด
ข้อมูล: ${JSON.stringify(data)}`;
    const out=await sample.json(prompt,{modelTier:"default"});
    if(!out||typeof out.summary!=="string") throw {message:"bad"};
    store.set("brief:"+S.date,{at:new Date().toISOString(),summary:out.summary.slice(0,600),notes:(Array.isArray(out.notes)?out.notes:[]).slice(0,5).map(n=>({match:String(n.match||"").slice(0,60),text:String(n.text||"").slice(0,240)}))});

  if(t.dataset.analyze){ S.analyze=t.dataset.analyze; return render(); }
  if(t.dataset.style){ S.style=t.dataset.style; store.set("style",S.style); return render(); }
  if(t.dataset.unfav){ delete S.favs[t.dataset.unfav]; store.set("favs",S.favs); return render(); }
  if(t.dataset.tab){ e.preventDefault(); S.tab=t.dataset.tab; try{ history.replaceState(null,"","#"+S.tab); }catch{} render(); window.scrollTo(0,0); return; }
  if(t.dataset.goto){ e.preventDefault(); S.tab="more"; render(); document.getElementById(t.dataset.goto)?.scrollIntoView(); return; }
  if(t.id==="btnBrief") return runBrief();
  if(t.id==="btnSearch"){ const r=$("#searchRow"); r.hidden=!r.hidden; if(!r.hidden) $("#q").focus(); else { S.q=""; $("#q").value=""; render(); } return; }
  if(t.id==="btnRefresh"||t.id==="btnRefresh2"){ S.liveOk=null; return refresh(S.date,true); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && S.open) return closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.matches?.(".match[role=button]")){ e.preventDefault(); openMatch(e.target.dataset.open); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ S.q=e.target.value.trim(); render(); }
  if(["cHome","cAway","tOver","tUnder"].includes(e.target.id)) runCalc();
});
document.addEventListener("change",e=>{
  if(e.target.id==="leagueSel"){ S.league=e.target.value; render(); }
  if(["cLine","tLine"].includes(e.target.id)) runCalc();
});
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(TABS.some(([k])=>k===h)) S.tab=h;
  if(h.startsWith("match-")){ const id=h.slice(6); const d=Object.keys(SNAPSHOT||{}).find(d=>SNAPSHOT[d].matches.some(m=>m.id===id)); if(d){ render(); openMatch(id,d); return true; } }
  return false;
}
window.addEventListener("hashchange",()=>{ if(!fromHash()) render(); });

/* start on today; if today has nothing saved, jump to the nearest saved day so the board isn't empty */
(function start(){
  const t=bkkToday();
  if(!getDay(t).matches.length && !store.get("day:"+t,null)){ const ds=Object.keys(SNAPSHOT||{}).sort(); const near=ds.find(d=>d>=t); if(near) S.date=near; }
  if(!fromHash()) render();
  probeLive().then(ok=>{ if(ok && !getDay(t).matches.length) S.date=t; refresh(S.date,false); });
  if("serviceWorker" in navigator && location.protocol==="https:" && !window.claude){ try{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }catch{} }
})();
</script>
